[package]
name = "floatkeyrusts"
version = "1.0.0"
edition = "2021"
description = "FloatKeys floating virtual keyboard - Rust port"

[[bin]]
name = "FloatKeyrusts"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 1
codegen-units = 16
lto = false
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 0
incremental = true
debug = false


